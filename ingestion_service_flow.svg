<svg width="100%" viewBox="0 0 1160 940" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Ingestion service flow and Redis keyspaces</title>
  <desc>Flow diagram showing S3 file receipt, Redis idempotency checks, duplicate rejection, NACHA parsing, per-transaction RTN validation with Redis cache and database fallback, in-process control total validation, processed-file marking, and Kafka publication. Includes Redis keyspaces for participant and processed file records.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .label { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #111827; }
      .title { font-size: 26px; font-weight: 700; letter-spacing: 0; }
      .subtitle { font-size: 14px; font-weight: 500; fill: #4b5563; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: #374151; }
      .node-title { font-size: 16px; font-weight: 700; }
      .node-subtitle { font-size: 13px; font-weight: 500; fill: #4b5563; }
      .small { font-size: 12px; font-weight: 600; fill: #4b5563; }
      .code { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; font-size: 13px; fill: #111827; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .thin-arrow { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
      .service-bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .step { filter: url(#shadow); }
    </style>
  </defs>

  <rect x="18" y="18" width="1124" height="904" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="580" y="58" class="label title" text-anchor="middle">Ingestion Service</text>
  <text x="580" y="84" class="label subtitle" text-anchor="middle">NACHA file intake, duplicate protection, validation, and publication</text>

  <rect x="56" y="118" width="692" height="768" rx="16" class="service-bg"/>
  <text x="92" y="150" class="label section">Processing Flow</text>

  <g class="step">
    <rect x="238" y="166" width="328" height="58" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="402" y="189" class="label node-title" text-anchor="middle">S3 Event</text>
    <text x="402" y="209" class="label node-subtitle" text-anchor="middle">file received</text>
  </g>

  <path class="arrow" d="M402 224L402 255"/>

  <g class="step">
    <rect x="238" y="255" width="328" height="58" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="402" y="278" class="label node-title" text-anchor="middle">Check Idempotency Store</text>
    <text x="402" y="298" class="label node-subtitle" text-anchor="middle">Redis lookup by idempotency key</text>
  </g>

  <path class="arrow" d="M402 313L402 344"/>

  <g class="step">
    <path d="M402 344L512 390L402 436L292 390Z" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="402" y="384" class="label node-title" text-anchor="middle">Duplicate?</text>
    <text x="402" y="405" class="label node-subtitle" text-anchor="middle">reject if already seen</text>
  </g>

  <path class="arrow" d="M512 390L632 390"/>
  <text x="574" y="377" class="label small" text-anchor="middle">yes</text>

  <g class="step">
    <rect x="632" y="360" width="94" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="679" y="383" class="label node-title" text-anchor="middle">Reject</text>
    <text x="679" y="403" class="label node-subtitle" text-anchor="middle">duplicate</text>
  </g>

  <path class="arrow" d="M402 436L402 467"/>
  <text x="423" y="455" class="label small">no</text>

  <g class="step">
    <rect x="238" y="467" width="328" height="58" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="402" y="490" class="label node-title" text-anchor="middle">Parse NACHA Records</text>
    <text x="402" y="510" class="label node-subtitle" text-anchor="middle">expand file into transactions</text>
  </g>

  <path class="arrow" d="M402 525L402 556"/>

  <g class="step">
    <rect x="238" y="556" width="328" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="402" y="579" class="label node-title" text-anchor="middle">Validate RTN</text>
    <text x="402" y="599" class="label node-subtitle" text-anchor="middle">per transaction; Redis cache then DB fallback</text>
  </g>

  <path class="arrow" d="M402 614L402 645"/>

  <g class="step">
    <rect x="238" y="645" width="328" height="58" rx="8" fill="#ecfeff" stroke="#0891b2"/>
    <text x="402" y="668" class="label node-title" text-anchor="middle">Validate Control Totals</text>
    <text x="402" y="688" class="label node-subtitle" text-anchor="middle">batch and file totals in process</text>
  </g>

  <path class="arrow" d="M402 703L402 734"/>

  <g class="step">
    <rect x="238" y="734" width="328" height="58" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="402" y="757" class="label node-title" text-anchor="middle">Mark File Processed</text>
    <text x="402" y="777" class="label node-subtitle" text-anchor="middle">write processing record to Redis</text>
  </g>

  <path class="arrow" d="M402 792L402 823"/>

  <g class="step">
    <rect x="238" y="823" width="328" height="58" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="402" y="846" class="label node-title" text-anchor="middle">Emit Validated Transactions</text>
    <text x="402" y="866" class="label node-subtitle" text-anchor="middle">publish to Kafka</text>
  </g>

  <rect x="804" y="118" width="288" height="282" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="948" y="151" class="label section" text-anchor="middle">Redis</text>

  <rect x="834" y="176" width="228" height="62" rx="8" fill="#ffffff" stroke="#f59e0b"/>
  <text x="948" y="200" class="label node-title" text-anchor="middle">Idempotency Store</text>
  <text x="948" y="220" class="label node-subtitle" text-anchor="middle">duplicate detection and processed files</text>

  <rect x="834" y="262" width="228" height="62" rx="8" fill="#ffffff" stroke="#f59e0b"/>
  <text x="948" y="286" class="label node-title" text-anchor="middle">Participant Cache</text>
  <text x="948" y="306" class="label node-subtitle" text-anchor="middle">RTN participant records</text>

  <path class="thin-arrow" d="M566 284L804 207"/>
  <text x="684" y="228" class="label small" text-anchor="middle">read idempotency key</text>

  <path class="thin-arrow dashed" d="M566 585L804 293"/>
  <text x="696" y="431" class="label small" text-anchor="middle">cache lookup</text>

  <path class="thin-arrow" d="M566 763L804 207"/>
  <text x="704" y="714" class="label small" text-anchor="middle">write processed record</text>

  <rect x="804" y="432" width="288" height="116" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="948" y="465" class="label section" text-anchor="middle">Database</text>
  <rect x="834" y="490" width="228" height="34" rx="8" fill="#ffffff" stroke="#38bdf8"/>
  <text x="948" y="511" class="label node-subtitle" text-anchor="middle">RTN registry fallback</text>
  <path class="thin-arrow dashed" d="M948 324L948 490"/>
  <text x="976" y="410" class="label small">cache miss</text>

  <rect x="804" y="580" width="288" height="180" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="948" y="613" class="label section" text-anchor="middle">Redis Keyspaces</text>
  <text x="832" y="646" class="code">participants:{rtn}</text>
  <text x="832" y="668" class="label node-subtitle">ParticipantRecord</text>
  <text x="832" y="688" class="label small">TTL: 4 hrs</text>
  <line x1="832" y1="706" x2="1064" y2="706" stroke="#cbd5e1"/>
  <text x="832" y="731" class="code">files:processed:{idempKey}</text>
  <text x="832" y="753" class="label node-subtitle">ProcessingRecord</text>
  <text x="832" y="773" class="label small">TTL: 24 hrs; persistent record policy</text>

  <rect x="804" y="792" width="288" height="94" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="948" y="825" class="label section" text-anchor="middle">Kafka</text>
  <rect x="834" y="848" width="228" height="24" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="948" y="865" class="label node-subtitle" text-anchor="middle">validated transactions topic</text>
  <path class="arrow" d="M566 852L804 852"/>
</svg>
